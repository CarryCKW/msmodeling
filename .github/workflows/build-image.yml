# 参照 aiconfigurator-npu 的 build-image workflow，适配为推送到个人 quay.io。
# 构建完整运行镜像（docker/Dockerfile：CANN devel 基础 + torch 生态 + msmodeling）。
#
# 前置：在 GitHub 仓库 Settings -> Secrets and variables -> Actions 添加两个 Secret：
#   QUAY_USERNAME  = quay.io 用户名（或 robot 账号名）
#   QUAY_PASSWORD  = quay.io 密码（或 robot 账号 token，推荐）
# 且该账号对 caigentle namespace 有写权限。

name: Build and Push msModeling NPU Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (e.g., v1, latest)'
        required: true
        default: 'latest'
      ref:
        description: 'Git ref to build (branch / tag / sha)'
        required: true
        default: 'master'
      base_image:
        description: 'Base CANN image (with toolkit/msprof)'
        required: true
        default: 'quay.io/ascend/cann:9.0.0-910b-openeuler24.03-py3.11-devel'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: quay.io
  IMAGE_NAME: caigentle/msmodeling

jobs:
  build-and-push:
    name: Build and Push msModeling NPU Image
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0
          lfs: false          # 镜像只需要源码；LFS 的 profiling CSV 运行时挂载

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=sha,prefix=

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ inputs.base_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Pushed image ${{ steps.meta.outputs.tags }}"
